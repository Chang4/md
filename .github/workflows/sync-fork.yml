name: Sync Fork with Upstream

on:
  # 1. 定时触发：每天 UTC 时间凌晨 2:00（即北京时间早上 10:00）执行
  schedule:
    - cron: '0 2 * * *'
  # 2. 支持手动触发：方便你随时在 GitHub 页面点击按钮强制同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      # 1. 检出你的 Fork 仓库代码（获取完整历史记录以便合并）
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. 配置 Git 用户信息
      - name: Configure Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      # 3. 添加原作者的仓库为 upstream
      - name: Add upstream remote
        run: git remote add upstream https://github.com/doocs/md.git

      # 4. 拉取原作者的最新代码
      - name: Fetch upstream
        run: git fetch upstream

      # 5. 将原作者的 main 分支合并到你的 main 分支
      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main

      # 6. 将合并后的最新代码推送到你的 Fork 仓库
      - name: Push changes to fork
        uses: ad-m/github-push-action@master
        with:
          branch: main
          github_token: ${{ secrets.GITHUB_TOKEN }}
